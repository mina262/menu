:root{--bg:#0d0b0f;--glass:rgba(22,18,26,.72);--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.08);--text:#f6f1e9;--muted:#b9b0a6;--faint:#8a8178;
--gold:#e2a336;--gold2:#f5d48a;--gold3:#a8711a;--wine:#7a1630;--wine2:#4a0d1f;--green:#25a35a;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.55;
background:radial-gradient(120% 60% at 50% -10%,rgba(122,22,48,.55),transparent 60%),radial-gradient(60% 40% at 100% 30%,rgba(226,163,54,.07),transparent 70%),radial-gradient(60% 40% at 0% 70%,rgba(122,22,48,.18),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.disp{font-family:'Display','Cairo',serif;font-weight:700}
.goldtext{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
/* hero */
.hero{position:relative;text-align:center;padding:42px 0 22px}
.crest{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--gold);
background:radial-gradient(circle at 50% 35%,rgba(245,212,138,.16),rgba(122,22,48,.35) 70%);box-shadow:0 0 0 1px rgba(226,163,54,.55),0 0 0 6px rgba(226,163,54,.08),0 12px 50px rgba(226,163,54,.25)}
.crest svg{width:64px;height:64px;filter:drop-shadow(0 2px 10px rgba(226,163,54,.45))}
.hero h1{margin:0;font-size:clamp(34px,9vw,52px);line-height:1.15;letter-spacing:.5px}
.tag{margin-top:6px;color:var(--gold);font-size:13px;letter-spacing:3px;text-transform:uppercase}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:16px auto 0;max-width:260px;color:var(--gold)}
.orn:before,.orn:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(226,163,54,.7),transparent)}
.orn i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 12px var(--gold)}
.lang{position:absolute;top:18px;inset-inline-end:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid rgba(226,163,54,.4);border-radius:999px;padding:6px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.orderTop{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;color:#24160a;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 8px 26px rgba(226,163,54,.35)}
.orderTop svg{width:20px;height:20px}
.banner{position:relative;overflow:hidden;margin:20px auto 0;max-width:560px;border-radius:14px;padding:12px 18px;text-align:center;font-weight:700;color:#24160a;
background:linear-gradient(100deg,var(--gold3),var(--gold) 30%,var(--gold2) 50%,var(--gold) 70%,var(--gold3));box-shadow:0 8px 30px rgba(226,163,54,.25);white-space:pre-line}
.banner:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.8s var(--ease) infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
/* sticky bar */
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:12px 16px 8px;background:linear-gradient(var(--bg),rgba(13,11,15,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sbox{position:relative}
.sbox svg{position:absolute;top:50%;inset-inline-start:14px;width:19px;height:19px;transform:translateY(-50%);color:var(--faint)}
.search{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;padding-inline-start:42px;font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:rgba(226,163,54,.7);box-shadow:0 0 0 4px rgba(226,163,54,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

    out.push((i + 1) + ') ' + nm + ' × ' + l.q + ' = ' + money(l.it.p * l.q) + ' ' + t.cur);
  });
  out.push('');
  if (dep || ar) out.push(t.goods + ': ' + money(cartTotal()) + ' ' + t.cur);
  if (dep) out.push(t.deposits + ': ' + money(dep) + ' ' + t.cur);
  if (ar) out.push(t.deliveryFee + ' (' + pick(ar) + '): ' + money(ar.fee) + ' ' + t.cur);
  out.push('*' + t.total + ': ' + money(grandTotal()) + ' ' + t.cur + '*' + (ar || !D.areas.length ? '' : ' (' + t.noDelivery + ')'));
  out.push('');
  if (who.name) out.push('👤 ' + t.name + ': ' + who.name);
  if (who.phone) out.push('📞 ' + t.phone + ': ' + who.phone);
  if (ar) out.push('📍 ' + t.area + ': ' + pick(ar));
  if (who.address) out.push('🏠 ' + t.address + ': ' + who.address);
  if (mapLink()) out.push('🗺️ ' + t.mapLabel + ': ' + mapLink());
  if (who.notes) out.push('📝 ' + t.notesLabel + ': ' + who.notes);

const waUrl = () => 'https://wa.me/' + D.order + '?text=' + encodeURIComponent(message());
let sheetStep = 1;

function totalsBox() {

function stepDetails(panel) {

  };

  field('phone', t.phone, { req: true, tel: true, ph: '01xxxxxxxxx' });
  if (D.areas.length) {

    if (!area()) who.area = '';
    sel.value = who.area || '';
    const err = el('div', 'ferr'); err.hidden = true;

    wrap.append(sel, err); panel.append(wrap); fields.area = { f: sel, err };

    const bad = [];

    if (!who.name) mark('name', t.reqd);
    const d = digitsOf(who.phone); if (!d) mark('phone', t.reqd); else if (d.length < 10) mark('phone', t.phoneBad);
    if (D.areas.length && !area()) mark('area', t.reqd);
    if (!who.address) mark('address', t.reqd);
    if (bad.length) { msg.textContent = t.fix; msg.hidden = false; bad[0].scrollIntoView({ block: 'center', behavior: 'smooth' }); bad[0].focus({ preventScroll: true }); return false; }
    msg.hidden = true; return true;

  if (!web) {

        items: lines().map((l) => ({ id: l.it.id, q: l.q })), name: who.name, phone: who.phone, address: who.address, notes: who.notes || '',
        areaId: area()?.id || 0, lat: who.lat ?? null, lng: who.lng ?? null, lang, total: grandTotal(), cid: pendingCid, hp: hp.value }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'error');
      pendingCid = null;
      cart = {}; saveCart(); render();
      const no = 'W' + String(j.no).padStart(4, '0');
      if (j.no) { myOrders.unshift({ no: j.no, p: digitsOf(who.phone).slice(-4), at: Date.now() }); saveMine(); track(); }

// The exact spot on the map (optional, both ways of ordering): sent to the store and added to the WhatsApp message.
